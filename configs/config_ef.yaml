data:
  bf_train_dir: /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/BF/train
  fl_train_dir: /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/FL/train
  bf_test_dir:  /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/BF/test
  fl_test_dir:  /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/FL/test
  labels_csv:   /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/train.csv
  sample_submission_csv: /root/.cache/kagglehub/competitions/multimodal-cancer-classification-challenge-2026/sampleSubmission.csv

split:
  n_folds: 3                          # only 12 patients -- 2 folds is the right call
  seed: 0

model:
  type: early_fusion_concat
  backbone: convnextv2_tiny.fcmae_ft_in22k_in1k
  img_size: 128

training:
  epochs: 30
  batch_size: 256
  num_workers: 8
  optimizer: AdamW
  lr: 8.0e-5
  weight_decay: 0.15                  # mild L2, not a wall
  scheduler: CosineAnnealingLR
  eta_min: 1.0e-7
  dropout: 0.20                       # light dropout before the classifier
  mixup_alpha: 0.5                    # gentle mixup; class weights + per-sample BCE handle imbalance

pretraining:
  enabled: false                      # SimCLR pretraining off in the Best.py reproduction
  epochs: 10
  batch_size: 1024
  accum_steps: 2
  num_workers: 8
  prefetch_factor: 4
  subsample_frac: 1.0
  lr: 1.5e-4
  weight_decay: 0.05
  temperature: 0.1
  proj_dim: 128
  proj_hidden_dim: 512
  freeze_strategy: partial
  checkpoint_path: outputs/checkpoints/pretrained_ef_backbone.pt

inference:
  tta: true                           # 4-view (h-flip / v-flip / both) averaged at test time

output:
  checkpoint_dir: outputs/checkpoints
  submission_dir: outputs/submissions
